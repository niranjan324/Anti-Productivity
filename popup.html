<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anti-Procrastination Tab Executioner</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body id="app-body">
  <!-- Scanline Background Overlay -->
  <div class="scanlines"></div>

  <!-- Single Vertical Flexbox Container (360x500px Strict Viewport) -->
  <div class="terminal-container" id="main-container">
    
    <!-- 1. Header Bar (~40px) -->
    <header class="hud-header">
      <div class="status-indicator">
        <span class="pulse-dot" id="status-dot"></span>
        <span class="protocol-text">PROTOCOL: LOCKDOWN</span>
      </div>
      <div class="header-controls">
        <button type="button" class="mode-chip" id="mode-toggle-btn" title="Toggle Demo Mode (All Tabs) vs Strict Mode (Distractions Only)">
          <span id="mode-label">ALL TABS</span>
        </button>
        <div class="streak-pill" id="streak-badge" title="Consecutive correct answers">
          <span class="streak-label">STREAK:</span>
          <span class="streak-count" id="streak-display">00</span>
        </div>
      </div>
    </header>

    <!-- 2. Tier Pill Ribbon (~30px) -->
    <div class="tier-ribbon-container">
      <button type="button" class="tier-ribbon tier-1" id="tier-badge" title="Click to cycle difficulty tier (Tiers 1-5)">
        <span class="tier-icon">⚡</span>
        <span class="tier-text" id="tier-text">TIER 1 // WARMUP</span>
      </button>
    </div>

    <!-- 3. Timer HUD Hero (~110px) -->
    <section class="timer-hud-hero">
      <div class="hud-meta-row">
        <span class="hud-caption">COUNTDOWN CADENCE</span>
        <span class="decay-badge" id="decay-hint">BASE: 22s</span>
      </div>
      <div class="timer-digits" id="timer-display">22.0s</div>
      <div class="progress-track">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
    </section>

    <!-- 4. Dynamic Math Equation Card (~135px Fixed Height) -->
    <section class="math-card" id="math-card">
      <div class="card-corner corner-tl"></div>
      <div class="card-corner corner-tr"></div>
      <div class="card-corner corner-bl"></div>
      <div class="card-corner corner-br"></div>
      <span class="card-sublabel" id="equation-sublabel">CALCULATE SUM</span>
      <div class="equation-container">
        <pre class="equation-content" id="problem-display">--</pre>
      </div>
    </section>

    <!-- 5. Input & Action Deck (~110px) -->
    <footer class="action-deck">
      <form class="deck-form" id="answer-form">
        <div class="input-row" id="input-wrapper">
          <input 
            type="text" 
            id="answer-input" 
            class="terminal-input" 
            placeholder="INPUT VALUE..." 
            autocomplete="off" 
            autofocus 
            required 
          />
          <button type="submit" id="submit-btn" class="submit-action-btn">EXECUTE</button>
        </div>
      </form>
      <div class="status-deck">
        <div class="status-readout" id="status-message" aria-live="polite">SYSTEM ARMED // READY</div>
        <div class="action-hint" id="penalty-hint">PRESS ENTER TO VERIFY • -5s ERROR PENALTY</div>
      </div>
    </footer>

  </div>

  <script src="math-engine.js"></script>
  <script src="popup.js"></script>
</body>
</html>
