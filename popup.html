<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anti-Procrastination Tab Executioner</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body id="app-body">
  <div class="container" id="main-container">
    <!-- Top Bar: Branding, Tier Badge & Streak Counter -->
    <header class="header">
      <div class="brand">
        <span class="status-dot" id="status-dot"></span>
        <h1 class="brand-title">TAB EXECUTIONER</h1>
      </div>
      <div class="header-badges">
        <button type="button" class="tier-badge tier-1" id="tier-badge" title="Click to cycle difficulty tier (Tiers 1-5)">WARMUP ⚡</button>
        <div class="streak-pill" id="streak-badge" title="Continuous correct equations">
          <span class="streak-icon">🔥</span>
          <span class="streak-text">STREAK</span>
          <span class="streak-count" id="streak-display">0</span>
        </div>
      </div>
    </header>

    <!-- Pitch / Mode Bar -->
    <div class="mode-bar">
      <span class="target-tag" id="target-indicator">TARGET: ALL ACTIVE TABS</span>
      <button type="button" class="mode-toggle-btn" id="mode-toggle-btn" title="Toggle Demo / Strict Mode">
        <span id="mode-label">DEMO MODE</span> ⚙️
      </button>
    </div>

    <!-- Main Stage Card -->
    <main class="stage-card" id="stage-card">
      <!-- High-Visibility Timer Section -->
      <section class="timer-section">
        <div class="timer-header-row">
          <span class="hud-label" id="hud-timer-label">TIME REMAINING</span>
          <span class="decay-hint" id="decay-hint">BASE: 22s</span>
        </div>
        <div class="timer-display" id="timer-display">22s</div>
      </section>

      <!-- Oversized Math Display Container -->
      <section class="equation-section">
        <span class="hud-label" id="equation-sublabel">CALCULATE SUM</span>
        <pre class="equation-display" id="problem-display">--</pre>
      </section>

      <!-- Input Form -->
      <form class="input-form" id="answer-form">
        <div class="input-wrapper" id="input-wrapper">
          <input 
            type="text" 
            id="answer-input" 
            class="answer-input" 
            placeholder="Integer answer..." 
            autocomplete="off" 
            autofocus 
            required
          />
          <button type="submit" id="submit-btn" class="submit-btn">SUBMIT</button>
        </div>
      </form>

      <!-- Status & Target Alert Notice -->
      <div class="status-message" id="status-message" aria-live="polite">Ready to solve!</div>
    </main>

    <!-- Footer Rules -->
    <footer class="footer">
      <span class="footer-hint" id="penalty-hint">⚠️ Wrong Answer = -5s Penalty | 0s = Tab Execution</span>
    </footer>
  </div>

  <script src="math-engine.js"></script>
  <script src="popup.js"></script>
</body>
</html>
